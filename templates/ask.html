{% extends "base.html" %}

{% block content %}

<h2 style="color: var(--text-secondary); margin-bottom: 20px;">✏️ Ask a Question</h2>
<p style="color: var(--text-muted); margin-bottom: 20px;">Ask a question and optionally provide an answer with media.</p>

<form method="post" enctype="multipart/form-data" style="display: flex; flex-direction: column; gap: 18px;">
    <!-- Question Section -->
    <div style="padding: 20px; border-radius: 16px; background: var(--bg-primary); box-shadow: var(--inset-shadow);">
        <h4 style="color: var(--accent-blue); margin-bottom: 15px;">📝 Your Question</h4>
        
        <div>
            <label style="font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 8px;">Question Text</label>
            <textarea name="text" required style="width: 100%; padding: 16px 20px; border: none; border-radius: 16px; background: var(--bg-primary); box-shadow: var(--inset-shadow); font-size: 16px; color: var(--text-primary); outline: none; resize: vertical; min-height: 100px; font-family: inherit;" placeholder="Type your question here..."></textarea>
        </div>
        
        <div style="margin-top: 15px;">
            <label style="font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 8px;">📷 Add Image (Optional)</label>
            <input type="file" name="image" accept="image/*" style="width: 100%; padding: 14px 20px; border: none; border-radius: 16px; background: var(--bg-primary); box-shadow: var(--inset-shadow); font-size: 16px; color: var(--text-primary); outline: none;">
        </div>
        
        <div style="margin-top: 15px;">
            <label style="font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 8px;">🎥 Add Video (Optional)</label>
            <input type="file" name="video" accept="video/*" style="width: 100%; padding: 14px 20px; border: none; border-radius: 16px; background: var(--bg-primary); box-shadow: var(--inset-shadow); font-size: 16px; color: var(--text-primary); outline: none;">
        </div>
        
        <div style="margin-top: 15px;">
            <label style="font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 8px;">🎵 Add Audio (Optional)</label>
            <input type="file" name="audio" accept="audio/*" style="width: 100%; padding: 14px 20px; border: none; border-radius: 16px; background: var(--bg-primary); box-shadow: var(--inset-shadow); font-size: 16px; color: var(--text-primary); outline: none;">
        </div>
    </div>
    
    <!-- Optional Answer Section -->
    <div style="padding: 20px; border-radius: 16px; background: var(--bg-primary); box-shadow: var(--inset-shadow); border-left: 4px solid var(--accent-green);">
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px;">
            <h4 style="color: var(--accent-green); margin: 0;">📌 Optional Answer</h4>
            <span style="background: var(--accent-green); color: white; padding: 2px 10px; border-radius: 20px; font-size: 11px;">Optional</span>
        </div>
        <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 15px;">Add an answer now, or let your friend reply later.</p>
        
        <div>
            <label style="font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 8px;">Answer Text</label>
            <textarea name="answer_text" style="width: 100%; padding: 16px 20px; border: none; border-radius: 16px; background: var(--bg-primary); box-shadow: var(--inset-shadow); font-size: 16px; color: var(--text-primary); outline: none; resize: vertical; min-height: 80px; font-family: inherit;" placeholder="Type the answer here... (Optional)"></textarea>
        </div>
        
        <div style="margin-top: 15px;">
            <label style="font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 8px;">📷 Answer Image (Optional)</label>
            <input type="file" name="answer_image" accept="image/*" style="width: 100%; padding: 14px 20px; border: none; border-radius: 16px; background: var(--bg-primary); box-shadow: var(--inset-shadow); font-size: 16px; color: var(--text-primary); outline: none;">
        </div>
        
        <div style="margin-top: 15px;">
            <label style="font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 8px;">🎥 Answer Video (Optional)</label>
            <input type="file" name="answer_video" accept="video/*" style="width: 100%; padding: 14px 20px; border: none; border-radius: 16px; background: var(--bg-primary); box-shadow: var(--inset-shadow); font-size: 16px; color: var(--text-primary); outline: none;">
        </div>
        
        <div style="margin-top: 15px;">
            <label style="font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 8px;">🎵 Answer Audio (Optional)</label>
            <input type="file" name="answer_audio" accept="audio/*" style="width: 100%; padding: 14px 20px; border: none; border-radius: 16px; background: var(--bg-primary); box-shadow: var(--inset-shadow); font-size: 16px; color: var(--text-primary); outline: none;">
        </div>
    </div>
    
    <div style="display: flex; gap: 15px; flex-wrap: wrap;">
        <button type="submit" class="btn btn-success btn-lg">📤 Ask Question</button>
        <a href="{{ url_for('dashboard') }}" class="btn btn-danger btn-lg">← Cancel</a>
    </div>
</form>

<script>
document.querySelectorAll('input[type="file"]').forEach(input => {
    input.addEventListener('change', function() {
        if (this.files.length > 0) {
            const size = (this.files[0].size / 1024 / 1024).toFixed(2);
            const label = this.parentElement.querySelector('label');
            if (label) {
                if (!label.textContent.includes('(')) {
                    label.textContent = label.textContent + ` (${size} MB)`;
                }
            }
        }
    });
});
</script>

{% endblock %}
